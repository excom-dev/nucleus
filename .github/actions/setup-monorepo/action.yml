name: Setup Monorepo
description: Checkout repo, setup node/pnpm, cache, install rush, and install deps
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24.13.0"

    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      with:
        version: 10

    # The Rush build cache is restored/saved by the main-branch workflows only
    # (deploy-docs, publish). The PR workflow selects work with
    # `--impacted-by`, so every selected project (or one of its dependencies)
    # has changed and its cache key always misses; downloading and then
    # re-uploading the whole cache directory there was pure overhead.

    - name: Cache Rush toolchain
      id: rush-tools-cache
      uses: actions/cache@v5
      with:
        path: |
          common/temp/install-run
          ${{ env.HOME }}/.rush
        key: rush-tools-${{ runner.os }}-${{ hashFiles('rush.json') }}
        restore-keys: |
          rush-tools-${{ runner.os }}-

    - name: Cache pnpm
      id: pnpm-cache
      uses: actions/cache@v5
      with:
        path: |
          common/temp/pnpm-store
          ~/.cache/Cypress
        key: pnpm-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    # `rush update` installs as part of updating; a second `rush install`
    # only re-validated the shrinkwrap.
    - run: node common/scripts/install-run-rush.js update
      shell: bash

    - name: Save Rush toolchain cache
      if: github.ref == 'refs/heads/main' && steps.rush-tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          common/temp/install-run
          ${{ env.HOME }}/.rush
        key: rush-tools-${{ runner.os }}-${{ hashFiles('rush.json') }}
