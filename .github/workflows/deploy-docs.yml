# Manual redeploy of the docs site from `main`. Pushes to `main` deploy
# through the Release workflow (publish.yml), after the version bump, so the
# site always shows the versions on npm. Run this from `main` only: the deploy
# build loads the Kit from unpkg at the workspace version, which the check below
# requires to be on npm as built here.
#
# CLOUDFLARE_API_TOKEN needs Workers Scripts:Edit (account), plus Workers
# Routes:Edit and DNS:Edit on the zone of the custom domain declared in
# packages/docs-site/wrangler.jsonc.
name: Deploy Docs Site

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # build, a pooled prerender (146 pages, about a minute locally) and the Chrome check: several times that on the runner
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      # Build cache only on main: `build --to docs-site` walks the whole graph, so
      # every unchanged package hits. PR runs (`--impacted-by`) never hit and no
      # longer download or upload it. See .github/actions/setup-monorepo.
      - name: Cache Rush build cache
        uses: actions/cache@v5
        with:
          path: common/temp/build-cache
          key: rush-build-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rush-build-cache-${{ runner.os }}-

      # Fresh package-meta.json + CEMs for every documented package.
      - run: node common/scripts/install-run-rush.js build:package-metas

      # Build workspace deps (the Nucleus Kit among them), then the docs site.
      - run: node common/scripts/install-run-rush.js build --to @excom/docs-site

      # The deploy build loads the Kit from unpkg at the workspace version: that
      # version on unpkg must be the Kit built here, or prerendered pages would
      # hydrate with other code.
      - name: Check the published Nucleus Kit
        working-directory: packages/docs-site
        run: node node_modules/@excom/heft-rig/scripts/kit-check.mjs
      - name: Build the docs site for deploy
        working-directory: packages/docs-site
        run: pnpm run build --kit=unpkg

      # Markdown API docs + llms.txt / llms-full.txt; copies llms into site dist.
      - run: node common/scripts/install-run-rush.js build:docs
      - run: node common/scripts/install-run-rush.js build:docs-index

      # Pages whose inputs did not change are reused from the last run's cache.
      - name: Restore prerender cache
        uses: actions/cache/restore@v5
        with:
          path: packages/docs-site/temp/prerender-cache
          key: prerender-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            prerender-${{ runner.os }}-
      # Every sitemap URL → a static page in the site dist, plus 404.html. Only
      # after the fresh build and build:docs-index above: a dist an earlier
      # prerender wrote is refused (rebuild the site first). Fails on a link
      # to a page of the site that has no file (a route the sitemap misses).
      - run: node common/scripts/install-run-rush.js build:prerender --only @excom/docs-site
      - name: Save prerender cache
        uses: actions/cache/save@v5
        with:
          path: packages/docs-site/temp/prerender-cache
          key: prerender-${{ runner.os }}-${{ github.sha }}
      # Chrome's sandbox needs unprivileged user namespaces, which Ubuntu restricts through AppArmor.
      # continue-on-error on this and the Chrome step: temporary, until the suite proves stable on the runner.
      - name: Allow user namespaces for Chrome's sandbox
        continue-on-error: true
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The prerendered pages in headless Chrome: they hydrate without a change and match a cold render.
      - name: Check the docs site in headless Chrome
        continue-on-error: true
        timeout-minutes: 10
        working-directory: packages/docs-site
        run: node support/tests/browser/run.mjs --detail

      # Bundle-size baseline for PR comments: merge this build's size reports
      # over the previous baseline and cache it for pr.yml.
      - name: Restore bundle-size baseline
        uses: actions/cache/restore@v5
        with:
          path: size-baseline
          key: size-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            size-baseline-${{ runner.os }}-
      - run: node .github/scripts/comment-size-report.mjs --write-baseline
      - name: Save bundle-size baseline
        uses: actions/cache/save@v5
        with:
          path: size-baseline
          key: size-baseline-${{ runner.os }}-${{ github.sha }}

      # From the repo root like Wrenfield: the action installs wrangler with npm
      # where it runs. Config paths resolve relative to the config file.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config packages/docs-site/wrangler.jsonc
