name: Test Packages

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: node common/scripts/install-run-rush.js change --verify
      - run: node .github/scripts/run-rush-for-changes.mjs coverage --verbose
      # One sticky comment from every packages/*/coverage/coverage-summary.json
      # the run produced (no artifact round-trip, no per-package matrix).
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/comment-coverage-report.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - run: node common/scripts/install-run-rush.js change --verify
      - run: node .github/scripts/run-rush-for-changes.mjs build --verbose
      # Bundle sizes of the packages just built, with gzip deltas against the
      # baseline the docs deploy saves from main (see deploy-docs.yml).
      - name: Restore bundle-size baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: size-baseline
          key: size-baseline-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            size-baseline-${{ runner.os }}-
      - name: Bundle-size PR comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/comment-size-report.mjs

  static-scan:
    name: SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.13.0"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10

      - name: Link pnpm lockfile
        run: ln -sf common/config/rush/pnpm-lock.yaml pnpm-lock.yaml

      - name: Generate CycloneDX SBOM
        # --spec-version 1.6: cdxgen >=12.8 emits CycloneDX 1.7 by default,
        # which grype/syft cannot decode yet ("sbom format not recognized").
        run: pnpm dlx @cyclonedx/cdxgen -t pnpm --no-install-deps --no-babel --spec-version 1.6 -o bom.json

      - name: Upload SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx.json
          path: bom.json

      - name: Grype Dependency Scanner (Report)
        id: scan-package
        uses: anchore/scan-action@40a61b52209e9d50e87917c5b901783d546b12d0
        with:
          sbom: bom.json
          fail-build: false
          severity-cutoff: critical
        timeout-minutes: 10

      - name: Upload Grype SARIF Results
        uses: actions/upload-artifact@v4
        with:
          name: grype-scan-results.sarif
          path: ${{ steps.scan-package.outputs.sarif }}

      - name: Comment SAST Summary
        if: github.event_name == 'pull_request'
        env:
          SARIF_PATH: ${{ steps.scan-package.outputs.sarif }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/comment-grype-summary.mjs
