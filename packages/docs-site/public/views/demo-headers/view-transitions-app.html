  <h2>View Transitions</h2>
  <p>Four cuts, each a Quark write inside a <code>@view-transition</code> block: a card that grows, pages that slide, a list that reflows, text that crossfades. The sheet writes attributes and content; the CSS names what should move and picks the motion by transition type. No app JS.</p>
