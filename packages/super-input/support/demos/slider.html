<div>
    <super-input reflect-value style="--super-input-min: 18; --super-input-max: 85;">
        <label>Age</label>
        <input type="range" name="age" step="1" value="36" min="18" max="85">
    </super-input>
    <!-- This is needed for Safari / Firefox -->
    <quark-sheet>
        super-input { --super-input-value: attr("current-value"); }
    </quark-sheet>
</div>
