<div>
  <provider-storage key-name="demo-provider-storage">
    <p>Seeded at: <output></output></p>
  </provider-storage>
  <button type="button">Seed localStorage &amp; re-read</button>
  <small role="note">Same-tab writes only show up after
    <code>key-name</code> is re-set; a write from another tab is picked up
    live.</small>
  <quark-sheet>
    @use "/demo-utils" as *;

    provider-storage {
      $stored: prop("provision");
      output { content: $stored.seededAt or "never"; }
    }
    button { @on click (handle: seedDemoStorage); }
  </quark-sheet>
</div>
