<div>
  <section>
    <dom-observer target-ref=":scope + details"></dom-observer>
    <details id="do-watched">
      <summary>Toggle me — mutates the "open" attribute</summary>
      <p>Toggling this
        fired <code>dom-observer-change</code>.</p>
    </details>
    <output></output>
  </section>
  <quark-sheet>
    section {
      @on dom-observer-change {
        output { content: "#{event.detail.mutations.length} mutation(s), open: #{event.detail.target.open}"; }
      }
    }
  </quark-sheet>
</div>
